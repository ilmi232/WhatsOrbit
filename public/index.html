<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsOrbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231ea5e3'/%3E%3Ccircle cx='12' cy='12' r='3' fill='none' stroke='white' stroke-width='1.8'/%3E%3Cellipse cx='12' cy='12' rx='9' ry='3.8' transform='rotate(-30 12 12)' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
</head>
<body>

<div id="login" class="login-wrap hidden">
  <form id="loginForm" class="card login">
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-30 12 12)"/><circle cx="20.2" cy="7.6" r="1.4" fill="currentColor" stroke="none"/></svg></div>
      <div><b>WhatsOrbit</b><span>WhatsApp Gateway</span></div>
    </div>
    <label class="field"><span>Password admin</span>
      <input id="pw" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn grad" style="width:100%;justify-content:center">Masuk</button>
  </form>
</div>

<div id="app" class="shell hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-30 12 12)"/><circle cx="20.2" cy="7.6" r="1.4" fill="currentColor" stroke="none"/></svg></div>
      <div><b>WhatsOrbit</b><span>WhatsApp Gateway</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <b>WhatsOrbit Dashboard</b>
      <span id="version"></span> · Self-hosted
      <div style="margin-top:6px">© 2026 Semesta</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn burger" id="burger" aria-label="Menu"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="spacer"></div>
      <div class="pill" id="ramPill" title="Pemakaian RAM server WhatsOrbit"></div>
      <button class="icon-btn" id="bellBtn" aria-label="Pesan gagal hari ini">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="dot bad hidden" id="bellDot"></span>
      </button>
      <div class="user">
        <div class="who"><b>Halo, Admin</b><span>Semesta</span></div>
        <div class="avatar">A</div>
      </div>
      <button class="icon-btn" id="gearBtn" aria-label="Pengaturan">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="logoutBtn" aria-label="Keluar" title="Keluar">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
      </button>
    </header>

    <main id="page"></main>
  </div>
</div>

<div id="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
